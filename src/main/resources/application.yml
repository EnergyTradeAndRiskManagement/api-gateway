server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: TradeApiGateway

  cloud:
    gateway:
      default-filters:
        - AuthenticationFilter
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:

        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/auth/**

        - id: trade-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/trades, /api/v1/trades/**, /api/v1/commodities, /api/v1/commodities/**

        - id: position-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/positions, /api/positions/**

        - id: risk-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/risk, /api/risk/**

        - id: market-data-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/market-data, /api/market-data/**, /api/valuation, /api/valuation/**

        - id: pnl-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/pnl, /api/pnl/**

        - id: batch-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/batch, /api/batch/**

jwt:
  secret: mySuperSecretFallbackKeyThatIsLongEnoughToPreventErrors123456!
